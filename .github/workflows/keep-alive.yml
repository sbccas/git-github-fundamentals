# Keeps the Supabase project awake: free projects are paused after about a week without database activity
# (https://supabase.com/docs/guides/platform/free-project-pausing). Every day this job makes one read-only request for
# the public student counter, the same request every visitor's home page makes. It uses only the PUBLIC publishable
# key that is already in the site (src/scripts/data/supabase.js), so no secrets are needed.
#
# GitHub switches off scheduled jobs in a public repository after 60 days without repository activity, so once a month
# the job also commits a one-line heartbeat (.github/keep-alive.txt). "[skip ci]" stops that commit from rebuilding the
# site. If the database ever stops answering, the run fails and GitHub emails the repository owner.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC (08:47 India time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ask the database for the public student counter
        run: |
          url=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/scripts/data/supabase.js | head -1)
          key=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" src/scripts/data/supabase.js | head -1)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "::error::Project URL or publishable key not found in src/scripts/data/supabase.js"; exit 1; fi
          for attempt in 1 2 3; do
            code=$(curl -sS -o reply.json -w '%{http_code}' -X POST "$url/rest/v1/rpc/course_stats" \
              -H "apikey: $key" -H 'Content-Type: application/json' -d '{}') || code=000
            if [ "$code" = "200" ]; then echo "Database awake: $(cat reply.json)"; exit 0; fi
            echo "Attempt $attempt: HTTP $code $(cat reply.json 2>/dev/null)"
            sleep 60
          done
          echo "::error::The database did not answer. If it is paused, open the Supabase dashboard and press Resume project."
          exit 1

      - name: Monthly heartbeat commit (keeps this schedule switched on)
        if: always()
        run: |
          f=.github/keep-alive.txt
          last=$(head -1 "$f" 2>/dev/null || true)
          last_s=$(date -u -d "${last:-1970-01-01}" +%s 2>/dev/null || echo 0)
          days=$(( ( $(date -u +%s) - last_s ) / 86400 ))
          if [ "$days" -lt 30 ]; then echo "Last heartbeat ${last} (${days} days ago); nothing to do."; exit 0; fi
          date -u +%F > "$f"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$f"
          git commit -m "chore: keep-alive heartbeat [skip ci]"
          git push
