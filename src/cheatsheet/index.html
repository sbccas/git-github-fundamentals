<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cheat sheet · Git & GitHub Fundamentals</title>
  <meta name="description" content="Every Git command from the course on one searchable, printable page.">
  <!-- @include head -->
  <link rel="stylesheet" href="/styles/lesson.css">
  <link rel="stylesheet" href="/styles/extras.css">
</head>
<body data-page="cheatsheet" class="page-cheatsheet">
  <!-- @include header -->
  <main id="main" class="container cs">
    <header class="cs-head">
      <div>
        <p class="eyebrow">Reference</p>
        <h1>Git cheat sheet</h1>
        <p class="lead">Every command in the course. Search, filter by unit, copy, or print it as a two-page handout.</p>
      </div>
      <button class="btn btn-ghost cs-print" type="button" onclick="window.print()">🖨 Print / PDF</button>
      <a class="btn btn-ghost cs-print" href="{{base}}book/student/">📖 Course ebook</a>
    </header>
    <div class="cs-tools">
      <label class="cs-search"><span class="visually-hidden">Search commands</span>
        <input type="search" placeholder="Search, e.g. undo, branch, push…" data-cs-search autocomplete="off" spellcheck="false">
      </label>
      <div class="cs-units" role="group" aria-label="Filter by unit" data-cs-units></div>
    </div>
    <p class="cs-count muted" data-cs-count aria-live="polite"></p>
    <div class="cs-grid" data-cs-grid></div>
    <p class="cs-foot muted">Git &amp; GitHub Fundamentals · SBCCAS, Amroli, Surat · sbccas.github.io/git-github-fundamentals</p>
  </main>
  <!-- @include footer -->
  <script type="module" src="/scripts/pages/cheatsheet.js"></script>
</body>
</html>
