<div class="table-wrap"><table class="dg-reset">
  <thead><tr><th>Command</th><th>Moves the branch back</th><th>Staging area</th><th>Your files</th></tr></thead>
  <tbody>
    <tr><td><code>git reset --soft HEAD~1</code></td><td class="yes">✓</td><td class="keep">changes stay <strong>staged</strong></td><td class="keep">kept</td></tr>
    <tr><td><code>git reset HEAD~1</code> <span class="muted">(--mixed)</span></td><td class="yes">✓</td><td class="keep">changes become <strong>unstaged</strong></td><td class="keep">kept</td></tr>
    <tr><td><code>git reset --hard HEAD~1</code></td><td class="yes">✓</td><td class="lose">cleared</td><td class="lose">⚠️ changes <strong>deleted</strong></td></tr>
  </tbody>
</table></div>
