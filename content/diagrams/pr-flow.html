<div class="pr-flow">
  <div class="pr-step"><span class="pr-n">1</span><b>Branch</b><code>git switch -c feature-cart</code></div>
  <div class="pr-step"><span class="pr-n">2</span><b>Commit &amp; push</b><code>git push -u origin feature-cart</code></div>
  <div class="pr-step"><span class="pr-n">3</span><b>Open a PR</b><span>on GitHub: <em>Compare &amp; pull request</em></span></div>
  <div class="pr-step"><span class="pr-n">4</span><b>Review</b><span>comments · request changes · approve</span></div>
  <div class="pr-step"><span class="pr-n">5</span><b>Merge</b><span>into <code>main</code> on GitHub, then delete the branch</span></div>
  <div class="pr-step"><span class="pr-n">6</span><b>Pull</b><code>git switch main &amp;&amp; git pull</code></div>
</div>
